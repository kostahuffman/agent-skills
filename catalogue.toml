# Canonical skill catalogue for kostahuffman/agent-skills.
#
# A release commit of this file defines the stable skill identifiers consumers
# may select and pins which content this fork owns versus mirrors from upstream.
# Consumers pin the release commit in skills.lock.toml and never read this file
# from a moving branch.
#
# See docs/skill-distribution.md for the contract.
